eval_per_marker: true

# Runtime fields (set by controller/worker)
run_id: null
summary_output_path: null
summary_output_dir: null
config_output_path: null

# Multi-run controller configuration
multi_run:
  num_runs: 3
  experiment_name: null
  confidence_level: 0.95
  experiment_root_dir: "eval_experiments"

# Weave configuration (change entity/project_name to your own if you're not the author)
weave:
  entity: "ip-ai"
  project_name: "eval_wonda"
  test_mode: false
  skip_weave: false
  run_id: null # optional run ID for unique Weave UI display name

# Evaluation configuration (public benchmark on HuggingFace)
dataset:
  # https://huggingface.co/datasets/idopinto/wonda-eval-benchmark-full
  name: "idopinto/wonda-eval-benchmark-full"
  limit: -1 # number of samples to evaluate -1 for all
  prefix: "" # prefix to filter files by (useful for testing also)
  split: "hard" # split to evaluate on
  re_split: true # re-split the dataset by difficultiy threshold
  difficulty_threshold: 15 # difficulty threshold for easy/hard split in seconds
  local_dir: null # path to a directory of .c files for local evaluation (e.g. "data/eval/lemur_sv_comp/orig_programs")
  baseline_json: null # path to baseline_dataset.json with per-program median_timing (e.g. "data/eval/lemur_sv_comp/baseline_uauto25/baseline_dataset.json")
  default_median_timing: 600.0 # fallback median_timing when loading local files (no baseline available)

# Scorer configuration
scorer:
  # currently only uautomizer is supported
  verifier:
    version: "25"
    property: "unreach-call.prp"
    arch: "32bit"
    timeout_seconds: 600.0
    use_runlim: true
  baseline_is_timeout: false # when true, the verifier timeout is always set to baseline timeout (useful to accelerate evaluation)

# Model and task configuration
defaults:
   - _self_
   - prompts: wonda
   - models: qwen3_0.6b_nt
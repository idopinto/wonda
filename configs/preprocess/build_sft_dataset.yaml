# Build SFT-ready training dataset.
# Used by: wonda/preprocess/build_sft_dataset.py
#
# Output (local cache only — never pushed to HF):
#   <output.dir>/Wonda-Training-Dataset-{Family}-V{0|1|2}/text.json
#   where {Family} is derived from tokenizer.name
#   (e.g. Qwen/Qwen3-0.6B -> Qwen3, meta-llama/Llama-3.1-8B-Instruct -> Llama3.1).
#
# V2 cache always retains quality_grade >= 1; stricter min_grade thresholds are
# applied at TRAIN time by load_or_build_sft_dataset(min_grade=...).
#
# Raw input source is derived automatically from `dataset.version`:
#   - V0 / V1: idopinto/Wonda-Training-Dataset-Full-Raw (split="full")
#   - V2:      idopinto/Wonda-Training-Dataset-Full     (split="train")
# Resolution order:
#   1. dataset.json_path if explicitly set.
#   2. Local fallback: data/train/<repo-basename>/<repo-basename>.json (if present).
#   3. HuggingFace Hub.
#
# Manual builds:
#   uv run -m wonda.preprocess.build_sft_dataset dataset.version=V0
#   uv run -m wonda.preprocess.build_sft_dataset dataset.version=V2
# Training scripts auto-trigger this build on cache miss (no need to run manually first).
dataset:
  version: "V2"  # V0 (raw) | V1 (normalized) | V2 (simplified + verified)
  json_path: null  # Optional explicit override; otherwise local-then-HF auto-resolution.
  limit: -1
  max_length: 1024

tokenizer:
  name: "Qwen/Qwen3-0.6B"
  # Model-specific kwargs passed to tokenizer.apply_chat_template().
  # Keeps the builder code model-agnostic (e.g. Qwen3: enable_thinking=false).
  chat_template_kwargs:
    enable_thinking: false

output:
  dir: "data/train/sft-ready/"

prompts:
  system_prompt: |
    You are an expert C programmer and highly proficient in generating strong loop invariants for C programs that accelerate traditional verifiers' verification process.

    ## Input format
    - A C program instrumented with loop markers of the form:
      ```c
      INVARIANT_MARKER_k();  // appears at the *start of each loop body*
      ```
      - The program contains a single target property as an assertion of the form:
      ```c
      assert(<target_property>);
      ```
    - A target loop marker (e.g., "INVARIANT_MARKER_1")

    ## Task
    - Propose ONE loop invariant that is intended to hold specifically at the target loop marker.
    - The invariant should help prove the target property and be inductive if possible.

    ## Output format
    - Output MUST be a single JSON object on one line wrapped in ```json``` tags and nothing else.
    - The JSON MUST have exactly these keys:
      - "marker": MUST be exactly the target loop marker (e.g., "INVARIANT_MARKER_1")
      - "content": ONLY a valid C boolean expression for the invariant.

    ## Output format example
    ```json
    {"marker":"<target_marker>","content":"<content>"}
    ```

  user_prompt_template: |
    ## User Input
    ### C Program
    ```c
    {program}
    ```

    ### Target Loop Marker
    {target_marker}

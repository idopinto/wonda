defaults:
  - _family/qwen_full@_here_
  - _shared/prompts@prompts: wonda
  - _self_

model:
  base_model_name: "Qwen/Qwen3-14B"

sft:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 5e-5
  eval_steps: 5

lora:
  lora_alpha: 64
  lora_dropout: 0.05
  r: 128
  bias: "none"
  target_modules: [
    "embed_tokens",
    "q_proj",
    "v_proj",
    "o_proj",
    "k_proj",
    "up_proj",
    "down_proj",
    "gate_proj",
  ]
  task_type: "CAUSAL_LM"
  modules_to_save: ["lm_head", "embed_tokens"]

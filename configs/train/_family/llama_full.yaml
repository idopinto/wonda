test_mode: false

wandb:
  use_wandb: true
  entity: "ip-ai"
  project: train-wonda-llama
  name: null

model:
  init_kwargs_train:
    attn_implementation: "flash_attention_2"
    use_cache: False
    device_map: "auto"
  inference:
    sampling_params:
      max_new_tokens: 1024
      temperature: 0.6
      top_p: 0.9
      do_sample: true

dataset:
  version: "v2"
  min_grade: null
  hf_repo: null
  hf_organization: "idopinto"
  json_path: null
  limit: -1
  split_ratio: 0.8

sft:
  output_dir: null
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  gradient_checkpointing: True
  optimizer: "adamw_torch_fused"
  logging_steps: 1
  save_strategy: "epoch"
  save_only_model: true
  learning_rate: 2e-5
  max_length: 1024
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  lr_scheduler_kwargs: {}
  dataset_text_field: "text"
  eval_strategy: "steps"
  eval_steps: 20
  report_to: "wandb"
  push_to_hub: True
  bf16: True

use_peft: false

lora:
  lora_alpha: 32
  lora_dropout: 0.05
  r: 64
  bias: "none"
  target_modules: [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
  ]
  task_type: "CAUSAL_LM"
